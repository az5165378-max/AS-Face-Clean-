<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="./manifest.json">
  <title>AS Face Clean - iPhone Studio Pro</title>
  <style>
    :root {
      --primary: #0284c7;
      --bg-gradient: linear-gradient(135deg, #090d16 0%, #0f172a 50%, #1e1b4b 100%);
      --card-bg: rgba(255, 255, 255, 0.98);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent: #059669;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg-gradient);
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 520px;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      padding: 25px;
      border-radius: 28px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
      text-align: center;
      box-sizing: border-box;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .logo-area h1 {
      color: var(--text-main);
      font-size: 24px;
      margin: 0 0 5px 0;
      font-weight: 800;
    }

    .logo-area p {
      color: var(--text-muted);
      font-size: 13px;
      margin: 0 0 15px 0;
      line-height: 1.4;
    }

    .upload-box {
      border: 2px dashed #38bdf8;
      padding: 25px 15px;
      border-radius: 18px;
      background: #f0f9ff;
      cursor: pointer;
      margin-bottom: 15px;
      transition: all 0.35s ease;
    }

    .upload-box:hover {
      border-color: var(--primary);
      background: #e0f2fe;
    }

    .upload-icon {
      font-size: 35px;
      margin-bottom: 8px;
    }

    .upload-box span {
      color: var(--primary);
      font-weight: 700;
      font-size: 15px;
      display: block;
    }

    .upload-box small {
      color: var(--text-muted);
      font-size: 12px;
      margin-top: 4px;
      display: block;
    }

    input[type="file"] {
      display: none;
    }

    .editor-section {
      display: none;
      margin-top: 10px;
      text-align: right;
    }

    .controls-box {
      background: #f1f5f9;
      padding: 12px 15px;
      border-radius: 16px;
      margin-bottom: 15px;
    }

    .control-group {
      margin-bottom: 8px;
    }

    .control-group label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-main);
      display: flex;
      justify-content: space-between;
      margin-bottom: 2px;
    }

    .control-group input[type="range"] {
      width: 100%;
      accent-color: var(--primary);
      height: 5px;
    }

    .image-container {
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
      margin-bottom: 12px;
    }

    img {
      width: 100%;
      height: auto;
      display: block;
      transition: filter 0.1s ease-out;
    }

    .toggle-btn {
      background: #334155;
      color: white;
      border: none;
      padding: 12px 15px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      margin-bottom: 10px;
      transition: background 0.3s;
      width: 100%;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .toggle-btn:hover {
      background: #1e293b;
    }

    .download-btn {
      display: block;
      width: 100%;
      background: var(--accent);
      color: white;
      text-decoration: none;
      padding: 14px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 16px;
      box-sizing: border-box;
      transition: all 0.3s ease;
      box-shadow: 0 6px 20px rgba(5, 150, 105, 0.35);
      text-align: center;
    }

    .download-btn:hover {
      background: #047857;
    }

    .loader {
      display: none;
      width: 35px;
      height: 35px;
      border: 4px solid #e2e8f0;
      border-top: 4px solid var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 20px auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="logo-area">
      <h1>AS Face Clean  Pro</h1>
      <p>آئی فون اسٹوڈیو پورٹریٹ اور ایچ ڈی لُک</p>
    </div>

    <div class="upload-box" onclick="document.getElementById('imageInput').click()">
      <div class="upload-icon">💎</div>
      <span>تصویر منتخب کرنے کے لیے یہاں کلک کریں</span>
      <small>فارمیٹ: JPG, PNG</small>
      <input type="file" id="imageInput" accept="image/*">
    </div>

    <div class="loader" id="loadingSpinner"></div>

    <div class="editor-section" id="editorSection">
      <!-- آئی فون پرو فلٹر کنٹرول سلائڈرز (بغیر ہینگ ہوئے) -->
      <div class="controls-box">
        <div class="control-group">
          <label>آئی فون برائٹنس: <span id="brightVal">105</span>%</label>
          <input type="range" id="brightnessRange" min="80" max="150" value="105" oninput="applyFilters()">
        </div>
        <div class="control-group">
          <label>آئی فون کنٹراسٹ (ڈیپ لُک): <span id="contrastVal">125</span>%</label>
          <input type="range" id="contrastRange" min="90" max="160" value="125" oninput="applyFilters()">
        </div>
        <div class="control-group">
          <label>سٹوڈیو کلر نکھار (Saturation): <span id="satVal">115</span>%</label>
          <input type="range" id="satRange" min="80" max="150" value="115" oninput="applyFilters()">
        </div>
        <div class="control-group">
          <label>اسکن گلو اور سمتھ (Blur Smooth): <span id="blurVal">0.6</span>px</label>
          <input type="range" id="blurRange" min="0" max="2" step="0.2" value="0.6" oninput="applyFilters()">
        </div>
      </div>

      <div class="image-container">
        <img id="displayImage" src="" alt="iPhone Processed Image">
      </div>

      <button class="toggle-btn" id="toggleBtn" onmousedown="showOriginal()" onmouseup="showProcessed()" ontouchstart="showOriginal()" ontouchend="showProcessed()">👆 اصل تصویر دیکھنے کے لیے دبا کر رکھیں (Before)</button>

      <a href="#" id="downloadBtn" download="AS-Face-Clean-iPhone.jpg" class="download-btn">📥 آئی فون ایچ ڈی تصویر ڈاؤن لوڈ کریں</a>
    </div>

    <canvas id="canvas" style="display:none;"></canvas>
  </div>

  <script>
    const imageInput = document.getElementById('imageInput');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const loadingSpinner = document.getElementById('loadingSpinner');
    const editorSection = document.getElementById('editorSection');
    const displayImage = document.getElementById('displayImage');
    const downloadBtn = document.getElementById('downloadBtn');
    
    let originalDataUrl = '';

    imageInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        loadingSpinner.style.display = 'block';
        editorSection.style.display = 'none';

        const reader = new FileReader();
        reader.onload = function(event) {
          originalDataUrl = event.target.result;
          const img = new Image();
          img.onload = function() {
            canvas.width = img.width;
            canvas.height = img.height;
            ctx.drawImage(img, 0, 0);

            displayImage.src = originalDataUrl;
            applyFilters();

            loadingSpinner.style.display = 'none';
            editorSection.style.display = 'block';
          }
          img.src = originalDataUrl;
        }
        reader.readAsDataURL(file);
      }
    });

    function applyFilters() {
      const brightness = document.getElementById('brightnessRange').value;
      const contrast = document.getElementById('contrastRange').value;
      const saturation = document.getElementById('satRange').value;
      const blur = document.getElementById('blurRange').value;

      document.getElementById('brightVal').innerText = brightness;
      document.getElementById('contrastVal').innerText = contrast;
      document.getElementById('satVal').innerText = saturation;
      document.getElementById('blurVal').innerText = blur;

      // آئی فون کیمرہ جیسا طاقتور اور فوری فلٹر جو موبائل کو بالکل ہینگ نہیں ہونے دیتا
      displayImage.style.filter = `brightness(${brightness}%) contrast(${contrast}%) saturate(${saturation}%) blur(${blur}px)`;
    }

    // فائنل ڈاؤن لوڈ کے وقت کینوس پر فلٹر پرنٹ کر کے سیو کرنا
    function prepareDownload() {
      const brightness = document.getElementById('brightnessRange').value;
      const contrast = document.getElementById('contrastRange').value;
      const saturation = document.getElementById('satRange').value;
      const blur = document.getElementById('blurRange').value;

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.filter = `brightness(${brightness}%) contrast(${contrast}%) saturate(${saturation}%) blur(${blur}px)`;
      
      const img = new Image();
      img.src = originalDataUrl;
      img.onload = function() {
        ctx.drawImage(img, 0, 0);
        downloadBtn.href = canvas.toDataURL('image/jpeg', 0.98);
      }
    }

    function showOriginal() {
      displayImage.style.filter = 'none';
      document.getElementById('toggleBtn').innerText = "👁️ اصل تصویر (Before)";
    }

    function showProcessed() {
      applyFilters();
      document.getElementById('toggleBtn').innerText = "👆 اصل تصویر دیکھنے کے لیے دبا کر رکھیں (Before)";
    }

    // جب بھی ڈاؤن لوڈ بٹن پر کلک ہو یا سلائیڈر ہلایا جائے
    document.querySelector('.controls-box').addEventListener('input', prepareDownload);
  </script>

</body>
</html>
