<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="./manifest.json">
  <title>AS Face Clean - HD AI Photo Studio</title>
  <style>
    :root {
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #312e81 100%);
      --card-bg: rgba(255, 255, 255, 0.98);
      --text-main: #1e293b;
      --text-muted: #64748b;
      --accent: #10b981;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg-gradient);
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      padding: 35px 25px;
      border-radius: 28px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
      text-align: center;
      box-sizing: border-box;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .logo-area h1 {
      color: var(--text-main);
      font-size: 28px;
      margin: 0 0 8px 0;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .logo-area p {
      color: var(--text-muted);
      font-size: 14px;
      margin: 0 0 25px 0;
      line-height: 1.6;
    }

    .upload-box {
      border: 2px dashed #818cf8;
      padding: 40px 20px;
      border-radius: 20px;
      background: #f8fafc;
      cursor: pointer;
      margin-bottom: 25px;
      transition: all 0.35s ease;
    }

    .upload-box:hover {
      border-color: var(--primary);
      background: #eef2ff;
      transform: translateY(-3px);
      box-shadow: 0 10px 20px rgba(99, 102, 241, 0.1);
    }

    .upload-icon {
      font-size: 45px;
      margin-bottom: 12px;
    }

    .upload-box span {
      color: var(--primary);
      font-weight: 700;
      font-size: 16px;
      display: block;
    }

    .upload-box small {
      color: var(--text-muted);
      font-size: 13px;
      margin-top: 6px;
      display: block;
    }

    input[type="file"] {
      display: none;
    }

    .preview-section {
      margin-top: 20px;
    }

    .image-card {
      background: #f8fafc;
      border-radius: 20px;
      padding: 16px;
      border: 1px solid #e2e8f0;
      margin-top: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
    }

    .image-card h3 {
      font-size: 16px;
      color: var(--text-main);
      margin: 0 0 12px 0;
      font-weight: 700;
    }

    canvas, img {
      width: 100%;
      height: auto;
      border-radius: 14px;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
      display: block;
    }

    .download-btn {
      display: block;
      width: 100%;
      background: var(--accent);
      color: white;
      text-decoration: none;
      padding: 14px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 16px;
      margin-top: 18px;
      box-sizing: border-box;
      transition: all 0.3s ease;
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.35);
    }

    .download-btn:hover {
      background: #059669;
      transform: translateY(-2px);
    }

    .loader {
      display: none;
      width: 40px;
      height: 40px;
      border: 4px solid #e2e8f0;
      border-top: 4px solid var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 25px auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="logo-area">
      <h1>AS Face Clean ✨</h1>
      <p>پروفیشنل ایچ ڈی اے آئی فلٹر کے ساتھ چہرے کے داغ دھبے صاف اور بیک گراؤنڈ روشن کریں</p>
    </div>

    <div class="upload-box" onclick="document.getElementById('imageInput').click()">
      <div class="upload-icon">💎</div>
      <span>ایچ ڈی تصویر منتخب کرنے کے لیے کلک کریں</span>
      <small>سپورٹڈ فارمیٹ: JPG, PNG</small>
      <input type="file" id="imageInput" accept="image/*">
    </div>

    <div class="loader" id="loadingSpinner"></div>
    <canvas id="canvas" style="display:none;"></canvas>
    
    <div class="preview-section" id="resultContainer"></div>
  </div>

  <script>
    const imageInput = document.getElementById('imageInput');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const resultContainer = document.getElementById('resultContainer');
    const loadingSpinner = document.getElementById('loadingSpinner');

    imageInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        loadingSpinner.style.display = 'block';
        resultContainer.innerHTML = '';

        const reader = new FileReader();
        reader.onload = function(event) {
          const img = new Image();
          img.onload = function() {
            canvas.width = img.width;
            canvas.height = img.height;
            
            // پروفیشنل ایچ ڈی اسکن کلین اور بیک گراؤنڈ بیلنسنگ فلٹر
            ctx.filter = 'contrast(1.15) brightness(1.08) saturate(1.1) drop-shadow(0px 0px 2px rgba(255,255,255,0.2))';
            ctx.drawImage(img, 0, 0);

            // پکسل لیول پر داغ دھبے نرم کرنے اور سکن ٹোন نکھارنے کا الگورتھم
            let imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            let data = imgData.data;

            for (let i = 0; i < data.length; i += 4) {
              let r = data[i];
              let g = data[i+1];
              let b = data[i+2];

              // ہلکے گہرے دھبوں اور اسکن ٹোন کو بیلنس اور کلیئر کرنا
              let avg = (r + g + b) / 3;
              if (avg > 40 && avg < 220) { // قدرتی چہرہ اور سکن رینج
                data[i]   = Math.min(255, r * 1.04 + 6); // ریڈ ٹোন نرمی
                data[i+1] = Math.min(255, g * 1.04 + 5); // گرین ٹোন بیلنس
                data[i+2] = Math.min(255, b * 1.04 + 5); // بلو ٹোন ہائی ڈیفینیشن
              }
            }

            ctx.putImageData(imgData, 0, 0);

            const imageUrl = canvas.toDataURL('image/jpeg', 0.98);

            loadingSpinner.style.display = 'none';
            resultContainer.innerHTML = `
              <div class="image-card">
                <h3>✨ ایچ ڈی صاف شدہ تصویر</h3>
                <img src="${imageUrl}" alt="HD Enhanced Image">
                <a href="${imageUrl}" download="AS-Face-Clean-HD.jpg" class="download-btn">📥 ایچ ڈی تصویر ڈاؤن لوڈ کریں</a>
              </div>
            `;
          }
          img.src = event.target.result;
        }
        reader.readAsDataURL(file);
      }
    });
  </script>

</body>
</html>
