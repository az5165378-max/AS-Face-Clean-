<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AS Face Clean - AI Photo Enhancer</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
            margin: 0;
            padding: 20px;
            text-align: center;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            font-size: 14px;
        }
        .upload-box {
            border: 2px dashed #3498db;
            padding: 30px;
            border-radius: 10px;
            background: #ecf0f1;
            cursor: pointer;
            margin: 20px 0;
            transition: 0.3s;
        }
        .upload-box:hover {
            background: #d0e1fd;
        }
        input[type="file"] {
            display: none;
        }
        .btn {
            background: #3498db;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin: 10px 5px;
            transition: 0.3s;
        }
        .btn:hover {
            background: #2980b9;
        }
        .btn-success {
            background: #27ae60;
        }
        .btn-success:hover {
            background: #219653;
        }
        canvas, img {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            margin-top: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .loader {
            display: none;
            margin: 20px auto;
            border: 4px solid #f3f3f3;
            border-radius: 50%;
            border-top: 4px solid #3498db;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>✨ AS Face Clean ✨</h1>
        <p>اپنی خراب، دھندلی یا داغ والی تصویر اپلوڈ کریں اور اسے صاف و روشن بنائیں!</p>

        <label class="upload-box" for="fileInput">
            <h3>تصویر منتخب کرنے کے لیے یہاں کلک کریں</h3>
            <p>JPG یا PNG فارمیٹ</p>
        </label>
        <input type="file" id="fileInput" accept="image/*">

        <div class="loader" id="loader"></div>

        <div>
            <canvas id="canvas" style="display:none;"></canvas>
        </div>

        <div id="actionButtons" style="display:none;">
            <button class="btn btn-success" id="downloadBtn">صاف شدہ تصویر ڈاؤن لوڈ کریں</button>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const loader = document.getElementById('loader');
        const actionButtons = document.getElementById('actionButtons');
        const downloadBtn = document.getElementById('downloadBtn');

        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            loader.style.display = 'block';
            actionButtons.style.display = 'none';

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    canvas.width = img.width;
                    canvas.height = img.height;

                    ctx.drawImage(img, 0, 0);

                    let imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    let data = imgData.data;

                    for (let i = 0; i < data.length; i += 4) {
                        let r = data[i];
                        let g = data[i + 1];
                        let b = data[i + 2];

                        data[i]     = Math.min(255, r * 1.1 + 10); 
                        data[i + 1] = Math.min(255, g * 1.1 + 10); 
                        data[i + 2] = Math.min(255, b * 1.1 + 10); 
                    }

                    ctx.putImageData(imgData, 0, 0);

                    loader.style.display = 'none';
                    canvas.style.display = 'block';
                    actionButtons.style.display = 'block';
                }
                img.src = event.target.result;
            }
            reader.readAsDataURL(file);
        });

        downloadBtn.addEventListener('click', function() {
            const link = document.createElement('a');
            link.download = 'cleaned-face.jpg';
            link.href = canvas.toDataURL('image/jpeg', 0.9);
            link.click();
        });
    </script>

</body>
</html>
